<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shukaib Ahmad — M. Islam & Sons</title>
<style>
  :root {
    --ink: #1b2a2e;
    --paper: #f6f4ee;
    --line: #d8d2c4;
    --accent: #2f6f5e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper);
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--ink);
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 36px 32px;
    text-align: center;
  }
  .logo {
    width: 72px;
    height: auto;
    margin-bottom: 16px;
  }
  .eyebrow {
    font-family: Arial, sans-serif;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 14px;
  }
  h1 {
    font-size: 26px;
    margin: 0 0 4px;
    font-weight: normal;
  }
  .title {
    font-family: Arial, sans-serif;
    font-size: 14px;
    color: #555;
    margin-bottom: 22px;
  }
  hr {
    border: none;
    border-top: 1px solid var(--line);
    margin: 22px 0;
  }
  .details {
    font-family: Arial, sans-serif;
    font-size: 14px;
    text-align: left;
    line-height: 1.9;
    color: #333;
  }
  .details a { color: var(--ink); text-decoration: none; }
  .details a:hover { color: var(--accent); }
  .save-btn {
    display: inline-block;
    margin-top: 26px;
    padding: 13px 28px;
    background: var(--accent);
    color: #fff;
    font-family: Arial, sans-serif;
    font-size: 14px;
    text-decoration: none;
    border-radius: 3px;
    letter-spacing: 0.02em;
  }
  .save-btn:hover { background: #24564a; }
</style>
</head>
<body>
  <div class="card">
    <img src="logo.png" alt="M. Islam & Sons logo" class="logo">
    <h1>Dr. Shukaib Ahmad</h1>
    <div class="title">Director — Regulatory Affairs &amp; Institutional Focal Person</div>
    <hr>
    <div class="details">
      📞 <a href="tel:+923338243974">+92 333 8243974</a><br>
      ✉️ <a href="mailto:Rtmedsutures@gmail.com">Rtmedsutures@gmail.com</a><br>
      🌐 <a href="https://www.misons.pk">www.misons.pk</a>
    </div>
    <a class="save-btn" href="contact.vcf" download>Save Contact</a>
  </div>
</body>
</html>
